name: Feature request
description: Propose a change before implementation work starts.
title: "[Feature]: "
labels: ["enhancement", "needs discussion"]
body:
  - type: markdown
    attributes:
      value: |
        Please open feature discussions before large implementation work. This project prioritizes small, local-first changes.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core library
        - Local web app
        - UI
        - Local storage
        - Installer or deployment script
        - Documentation
        - Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What simpler approach, workaround, or smaller scope did you consider?
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This keeps the app local-first.
        - label: This avoids a new database or service dependency.
        - label: This avoids a public API break, or explains why one is needed.
        - label: This avoids a major dependency upgrade, or explains why one is needed.
