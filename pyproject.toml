[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biodynamic-calendar"
version = "v0.26.230.3"
description = "Standalone biodynamic calendar library and local web app."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Tom Farley"}]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "jinja2>=3.1,<4.0",
  "httpx>=0.28,<1.0",
  "skyfield>=1.49,<2.0",
  "astral>=3.2,<4.0",
  "pywebview==5.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[project.scripts]
biodynamic-calendar = "biodynamic_calendar_app.desktop:main"
biodynamic-calendar-gui = "biodynamic_calendar_app.desktop:main"
biodynamic-calendar-server = "biodynamic_calendar_app.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
